# title: compile Qwen2.5-0.5B-Instruct → rbln-ca22-tp4-s8192-7da5effc0a0e
# Compile Job preview. Review, then apply with `kubectl apply -f -`.
# Model Qwen/Qwen2.5-0.5B-Instruct -> rbln compile -> shared store compiled/Qwen--Qwen2.5-0.5B-Instruct/rbln/rbln-ca22-tp4-s8192-7da5effc0a0e
# Compile-time fixed options: tp=4  max-len=8192  batch=1  attn=default  kvpart=4096  quant=none  npu=RBLN-CA22  devices=4
# Compile recipe (compile.py), mounted at /scripts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: compile-qwen--qw-80beb3-rbln-ca22-tp4-s8192-7da5effc0a0e-script
  namespace: llm-serving
data:
  compile.py: |
    # RBLN ahead-of-time compile (optimum-rbln). Mounted from a ConfigMap; all input via env.
    #
    #   MODEL_ID                    HF repo id or local path        (required)
    #   OUTPUT                      destination in the model store  (required)
    #   RBLN_NPU                    target chip                     (default RBLN-CA22)
    #   RBLN_TENSOR_PARALLEL_SIZE   chip count                      (default 1)
    #   RBLN_MAX_SEQ_LEN            compile-time context length     (default 4096)
    #   RBLN_BATCH_SIZE             static batch size               (default 1)
    #   RBLN_ATTN_IMPL              flash_attn | eager              (default SDK choice)
    #   RBLN_KVCACHE_PARTITION_LEN  flash_attn only                 (default 16384)
    #   RBLN_QUANTIZATION           none | w8a8 | w4a16            (prequantized checkpoint)
    import os

    # Report the toolchain before anything else. Compiles here failed for three different models
    # across three parameter sets with the same opaque codegen error, and nothing surfaced that the
    # host's transformers/torch had moved far ahead of optimum-rbln. lmd-top parses this line out of
    # the log into its history, so a version skew shows up as a pattern instead of a mystery.
    def _report_toolchain():
        import importlib.metadata as md

        parts = []
        for pkg in ("optimum-rbln", "rebel-compiler", "transformers", "torch"):
            try:
                parts.append(f"{pkg}={md.version(pkg)}")
            except Exception:
                parts.append(f"{pkg}=absent")
        print("LMD_TOOLCHAIN " + " ".join(parts), flush=True)

        # Compare what is installed against what the vendor SDK itself declares, rather than
        # against a compatibility matrix maintained by hand. optimum-rbln pins its dependencies
        # exactly, so this is a precise check — and it is the vendor's opinion, not ours.
        bad = []
        try:
            for req in md.requires("optimum-rbln") or []:
                spec = req.split(";")[0].strip()
                if "==" not in spec:
                    continue
                name, want = (p.strip() for p in spec.split("==", 1))
                try:
                    have = md.version(name)
                except Exception:
                    continue
                # PEP 440: when the specifier carries no local label, the candidate's local
                # label is ignored — `torch 2.11.0+cpu` satisfies `==2.11.0`. Comparing the raw
                # strings reported three mismatches on a perfectly correct install.
                def _public(v):
                    return v.split("+", 1)[0]

                if _public(have) != _public(want):
                    bad.append(f"{name} {have} != required {want}")
        except Exception:
            pass
        if bad:
            print("LMD_DEPS_MISMATCH " + "; ".join(bad[:4]), flush=True)


    _report_toolchain()


    # Not viable, recorded so nobody retries it: rebel ships core_ori/ as plain source next to
    # the frozen core, and compile_from_any resolves `compile` through a module global, so it looks
    # rebindable. Importing it aborts — both register the same TVM operator attributes:
    #
    #   InternalError: Check failed: (p.second != plevel) is false: Attribute
    #   target.rebel_descriptor of abs is already registered with same plevel=10
    #
    # Useful finding all the same: core_ori is a live implementation, not a stale snapshot, and
    # librbln.so is a TVM build — which is why TVM's own TVM_LOG_DEBUG / TVM_BACKTRACE apply here.

    from optimum.rbln import RBLNAutoModelForCausalLM as M

    get = os.environ.get
    output = os.environ["OUTPUT"]
    local = "/work/out"

    cfg = dict(
        rbln_npu=get("RBLN_NPU", "RBLN-CA22"),
        rbln_max_seq_len=int(get("RBLN_MAX_SEQ_LEN", "4096")),
        rbln_batch_size=int(get("RBLN_BATCH_SIZE", "1")),
    )

    # This describes an already quantized checkpoint; it does not run calibration or
    # quantize ordinary floating-point weights. The installed SDK validates this dict.
    quant = get("RBLN_QUANTIZATION", "none")
    quant_configs = {
        "w8a8": {"format": "rbln", "weights": "int8", "activations": "int8"},
        "w4a16": {"format": "rbln", "weights": "int4", "activations": "fp16"},
    }
    if quant != "none":
        if quant not in quant_configs:
            raise ValueError(f"Unsupported RBLN_QUANTIZATION {quant!r}; choose none/w8a8/w4a16")
        cfg["rbln_quantization"] = quant_configs[quant]

    # The kwarg naming the chip count differs across optimum-rbln versions: 0.11 takes
    # `rbln_num_devices`, 0.10 takes `rbln_tensor_parallel_size`. Rather than keep a version
    # matrix — which is the thing that keeps going wrong — ask the library: it rejects an
    # unknown kwarg by name, so try the candidates and keep the one it accepts.
    TP_KWARGS = ("rbln_tensor_parallel_size", "rbln_num_devices")
    tp = int(get("RBLN_TENSOR_PARALLEL_SIZE", "1"))
    # No default here. An absent RBLN_ATTN_IMPL means "do not set rbln_attn_impl at all" and let
    # optimum-rbln choose — which is what the artifacts that work on this hardware were built
    # with. Defaulting to flash_attn here silently re-added the flag after the manifest had
    # deliberately omitted it: the default existed in two places and the recipe's copy won.
    attn = get("RBLN_ATTN_IMPL", "")
    if attn:
        cfg["rbln_attn_impl"] = attn
        # Partitioning is a flash_attn concept, so it only travels with an explicit choice.
        if attn == "flash_attn":
            cfg["rbln_kvcache_partition_len"] = int(get("RBLN_KVCACHE_PARTITION_LEN", "16384"))

    # create_runtimes=False: compile without claiming a device, so serving may hold the chips.
    accepted_config = None

    def _from_pretrained(config):
        """Compile, choosing the tensor-parallel kwarg this optimum-rbln actually accepts."""
        global accepted_config
        last = None
        for name in TP_KWARGS:
            attempt = dict(config)
            attempt[name] = tp
            try:
                print(f"RBLN_CONFIG {attempt}", flush=True)
                compiled = M.from_pretrained(
                    os.environ["MODEL_ID"], export=True, rbln_create_runtimes=False, **attempt
                )
                accepted_config = attempt
                return compiled
            except ValueError as exc:
                # Only a rejection of *this* kwarg justifies trying the next name; any other
                # ValueError is a real problem and must not be masked by a retry.
                if "Unexpected arguments" not in str(exc) or name.removeprefix("rbln_") not in str(exc):
                    raise
                print(f"  {name} not accepted by this version, trying the next name", flush=True)
                last = exc
        raise last if last else RuntimeError("no tensor-parallel kwarg accepted")


    try:
        model = _from_pretrained(cfg)
    except Exception as exc:
        # rebel-compiler raises a bare RuntimeError from a frozen module, so the traceback alone
        # says only "Error occurred while compiling the model". Whatever detail exists lives in the
        # exception's args and cause chain; print it so the failure is reportable.
        import traceback

        print("LMD_COMPILE_ERROR", type(exc).__name__, repr(exc.args), flush=True)
        cause, depth = exc.__cause__ or exc.__context__, 0
        while cause is not None and depth < 5:
            print(
                "LMD_COMPILE_CAUSE",
                type(cause).__name__,
                repr(getattr(cause, "args", ())),
                flush=True,
            )
            cause, depth = cause.__cause__ or cause.__context__, depth + 1
        traceback.print_exc()
        raise
    # Build into local scratch first — the shared store is SMB and rejects the compiler's I/O.
    model.save_pretrained(local)

    # Publish from a hidden sibling directory; never merge files into a serving build.
    from importlib.util import spec_from_file_location, module_from_spec
    _spec = spec_from_file_location("lmd_publish", "/scripts/publish-artifact.py")
    _publisher = module_from_spec(_spec)
    _spec.loader.exec_module(_publisher)
    _publisher.publish(local, output, effective_options=accepted_config)
    print("COMPILE_DONE", os.listdir(output), flush=True)
  publish-artifact.py: |
    #!/usr/bin/env python3
    """Publish a complete build on the store filesystem without merging or overwriting.

    Staging and locks are hidden siblings, excluded by the discovery CronJob's * glob.
    A killed publisher may leave a hidden lock/staging directory for explicit recovery;
    readers continue seeing either no build or the previously published complete build.
    """
    import hashlib
    import importlib.metadata
    import platform
    import re
    from datetime import datetime, timezone
    import json
    import os
    from pathlib import Path
    import shutil
    import stat
    import sys
    import tempfile


    PACKAGES = ("optimum-rbln", "rebel-compiler", "furiosa-llm", "furiosa-compiler", "transformers", "torch")

    def artifact_manifest(source):
        """Hash files in bounded chunks; paths are relative POSIX names, sorted canonically.

        The root metadata file is excluded to avoid a recursive checksum. This observes
        bytes in the private staging copy, not mutable source paths or file timestamps.
        """
        source = Path(source)
        if not source.is_dir() or source.is_symlink():
            raise ValueError("artifact root must be a real directory")
        entries = []
        # os.walk with onerror avoids treating unreadable subtrees as an empty tree.
        def failed(error):
            raise error
        paths = []
        for directory, directories, files in os.walk(source, followlinks=False, onerror=failed):
            paths.extend(Path(directory) / name for name in directories + files)
        for path in sorted(paths):
            relative = path.relative_to(source).as_posix()
            mode = path.lstat().st_mode
            if stat.S_ISLNK(mode):
                raise ValueError(f"unsupported artifact link: {relative}")
            if stat.S_ISDIR(mode):
                continue
            if not stat.S_ISREG(mode):
                raise ValueError(f"unsupported artifact entry: {relative}")
            if relative == "lmd-build.json":
                continue
            digest = hashlib.sha256()
            size = 0
            with path.open("rb") as stream:
                while chunk := stream.read(1024 * 1024):
                    size += len(chunk)
                    digest.update(chunk)
            entries.append({"path": relative, "size_bytes": size, "sha256": digest.hexdigest()})
        canonical = json.dumps(entries, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode("utf-8")
        return entries, hashlib.sha256(canonical).hexdigest()


    def verify_artifact(directory):
        directory = Path(directory)
        metadata_path = directory / "lmd-build.json"
        if metadata_path.is_symlink() or not stat.S_ISREG(metadata_path.lstat().st_mode):
            raise ValueError("build metadata must be a regular file")
        metadata = json.loads(metadata_path.read_text())
        manifest = metadata.get("artifact_manifest", {})
        if manifest.get("algorithm") != "sha256-canonical-file-list-v1":
            raise ValueError("artifact has no supported content manifest")
        files, digest = artifact_manifest(directory)
        if files != manifest.get("files") or digest != metadata.get("artifact_content_sha256"):
            raise ValueError("artifact content verification failed")
        return digest


    def build_metadata(source, destination, effective_options=None):
        """Record observed facts only. This fingerprint is NOT a hash of artifact bytes."""
        source = Path(source)
        packages = {}
        for package in PACKAGES:
            try:
                packages[package] = importlib.metadata.version(package)
            except importlib.metadata.PackageNotFoundError:
                packages[package] = None
        revision = None
        config = source / "config.json"
        if config.is_file():
            try:
                candidate = json.loads(config.read_text()).get("_commit_hash")
                if isinstance(candidate, str) and re.fullmatch(r"[0-9a-fA-F]{40}", candidate):
                    revision = candidate.lower()
            except (ValueError, OSError):
                pass
        requested = json.loads(os.environ.get("LMD_BUILD_OPTIONS", "{}"))
        if not isinstance(requested, dict):
            raise ValueError("LMD_BUILD_OPTIONS must be a JSON object")
        allowed = {"tp", "pp", "max-len", "batch", "attn", "kvpart", "quant", "npu", "chunk", "block", "devices", "concurrency", "optim"}
        requested = {key: value for key, value in requested.items() if key in allowed}
        vendor = os.environ.get("LMD_BUILD_VENDOR")
        if effective_options is None and vendor == "furiosa":
            effective_options = {"tp": int(os.environ["TP"]), "pp": int(os.environ["PP"]),
                                 "max_model_len": int(os.environ["MAX_LEN"]), "concurrency": int(os.environ.get("FXB_CONCURRENCY", "8")),
                                 "optim_level": os.environ.get("FXB_OPTIM_LEVEL", "O3")}
        recipes = {}
        for name in ("compile.py", "compile.sh", "publish-artifact.py"):
            path = Path(__file__).parent / name
            if path.is_file():
                recipes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
        identity = {
            "model": os.environ.get("MODEL_ID"), "resolved_revision": revision,
            "vendor": vendor, "requested_image": os.environ.get("LMD_BUILD_IMAGE"),
            "requested_options": requested, "effective_options": effective_options,
            "packages": packages, "recipes_sha256": recipes,
            "python": platform.python_version(), "machine": platform.machine(),
        }
        fingerprint = hashlib.sha256(json.dumps(identity, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()).hexdigest()
        files, content_hash = artifact_manifest(source)
        return {
            "schema": "lmd-top/build/v2", "model": identity["model"],
            "execution_uid": os.environ.get("LMD_BUILD_UID", ""),
            "execution_uid_kind": "Pod", "target": Path(destination).name,
            "created_at": datetime.now(timezone.utc).isoformat(),
            "provenance": identity, "provenance_sha256": fingerprint,
            "artifact_content_sha256": content_hash,
            "artifact_manifest": {"algorithm": "sha256-canonical-file-list-v1", "files": files},
            "observed_image_digest": None,
            "compatibility": "unknown", "driver_version": None, "firmware_version": None,
            "limitations": ["fingerprint covers recorded provenance, not artifact contents",
                            "arbitrary environment overrides are not captured",
                            "runtime compatibility requires independent evidence"],
        }


    def publish(source, destination, effective_options=None):
        source, destination = Path(source), Path(destination)
        parent = destination.parent
        parent.mkdir(parents=True, exist_ok=True)
        lock = parent / (".lmd-publish-" + destination.name + ".lock")
        # Atomic mkdir serializes cooperating publishers, also on the shared SMB mount.
        lock.mkdir()
        stage = None
        try:
            if destination.exists() or destination.is_symlink():
                raise FileExistsError(f"build already published: {destination}; move/delete explicitly before rebuilding")
            if not source.is_dir() or not any(source.iterdir()):
                raise ValueError("compiler produced no artifact")
            stage = Path(tempfile.mkdtemp(prefix=".lmd-staging-", dir=parent))
            shutil.copytree(source, stage, dirs_exist_ok=True, symlinks=True)
            metadata = build_metadata(stage, destination, effective_options)
            (stage / "lmd-build.json").write_text(json.dumps(metadata, sort_keys=True, allow_nan=False) + "\n")
            # Same-filesystem directory rename publishes all files together. Never fall back
            # to a copy into destination if this filesystem cannot perform the rename.
            stage.rename(destination)
            stage = None
        finally:
            if stage is not None:
                shutil.rmtree(stage, ignore_errors=True)
            lock.rmdir()


    if __name__ == "__main__":
        if len(sys.argv) == 3 and sys.argv[1] == "--verify":
            print("CONTENT_VERIFIED", verify_artifact(sys.argv[2]), flush=True)
        else:
            publish(sys.argv[1], sys.argv[2])
            print("COMPILE_DONE", sys.argv[2], flush=True)
  bootstrap.sh: |
    #!/bin/sh
    # Prepare a bare ubuntu image to run the RBLN compile recipe against the node's own
    # rebel-compiler install (hostPath), then hand over to it. Mounted from a ConfigMap.
    #
    # Only used when no LMD_COMPILE_IMAGE_RBLN is configured. tzdata is needed because
    # pandas -> pytz reads /usr/share/zoneinfo, which minimal images do not ship.
    set -e

    export DEBIAN_FRONTEND=noninteractive
    apt-get update -qq >/dev/null 2>&1
    apt-get install -y -qq --no-install-recommends \
      python3.10 libnuma1 libgomp1 ca-certificates tzdata >/dev/null 2>&1
    ln -sf /usr/bin/python3.10 /usr/local/bin/python3

    exec python3 /scripts/compile.py
---
# RBLN: no registry image configured, so this borrows the target node's host rebel-compiler stack via hostPath (rbln_create_runtimes=False).
apiVersion: batch/v1
kind: Job
metadata:
  name: compile-qwen--qw-80beb3-rbln-ca22-tp4-s8192-7da5effc0a0e
  namespace: llm-serving
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: npu-1
      volumes:
      - name: store
        persistentVolumeClaim:
          claimName: model-store
      - name: script
        configMap:
          name: compile-qwen--qw-80beb3-rbln-ca22-tp4-s8192-7da5effc0a0e-script
      - name: work
        emptyDir: {}
      - name: hp-local
        hostPath:
          path: /home/gspark/.local/lib/python3.10/site-packages
          type: Directory
      - name: hp-sys
        hostPath:
          path: /usr/local/lib/python3.10/dist-packages
          type: Directory
      - name: hp-lib
        hostPath:
          path: /usr/lib
          type: Directory
      - name: hp-bin
        hostPath:
          path: /usr/bin
          type: Directory
      containers:
      - name: compile
        image: ubuntu:22.04
        command:
        - sh
        - /scripts/bootstrap.sh
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: MODEL_STORE
          value: /mnt/store
        - name: MODEL_ID
          value: Qwen/Qwen2.5-0.5B-Instruct
        - name: OUTPUT
          value: /mnt/store/compiled/Qwen--Qwen2.5-0.5B-Instruct/rbln/rbln-ca22-tp4-s8192-7da5effc0a0e
        - name: LMD_BUILD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: LMD_BUILD_VENDOR
          value: rbln
        - name: LMD_BUILD_IMAGE
          value: ubuntu:22.04
        - name: LMD_BUILD_OPTIONS
          value: '{"attn":"default","batch":"1","devices":"4","kvpart":"4096","max-len":"8192","npu":"RBLN-CA22","quant":"none","tp":"4"}'
        - name: HF_HOME
          value: /mnt/store/hub
        - name: PYTHONPATH
          value: /home/gspark/.local/lib/python3.10/site-packages:/host-sys:/host-lib/python3/dist-packages
        - name: LD_LIBRARY_PATH
          value: /host-lib:/host-lib/x86_64-linux-gnu
        - name: PATH
          value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/host-bin
        - name: RBLN_TENSOR_PARALLEL_SIZE
          value: '4'
        - name: RBLN_MAX_SEQ_LEN
          value: '8192'
        - name: RBLN_BATCH_SIZE
          value: '1'
        - name: RBLN_KVCACHE_PARTITION_LEN
          value: '4096'
        - name: RBLN_NPU
          value: RBLN-CA22
        resources:
          requests:
            cpu: '8'
            memory: 16Gi
        volumeMounts:
        - name: store
          mountPath: /mnt/store
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
        - name: hp-local
          mountPath: /home/gspark/.local/lib/python3.10/site-packages
        - name: hp-sys
          mountPath: /host-sys
        - name: hp-lib
          mountPath: /host-lib
        - name: hp-bin
          mountPath: /host-bin
