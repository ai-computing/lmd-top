# title: compile Qwen3-4B-FP8 → rngd-tp8-pp1-s8192
# Compile Job preview. Review, then apply with `kubectl apply -f -`.
# Model furiosa-ai/Qwen3-4B-FP8 -> furiosa compile -> shared store compiled/furiosa-ai--Qwen3-4B-FP8/furiosa/rngd-tp8-pp1-s8192
# Compile-time fixed options: tp=8  pp=1  max-len=8192  batch=1  chunk=none  block=16  quant=none  devices=1
# Compile recipe (compile.sh), mounted at /scripts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: compile-furiosa-ai--qwen3-4b-fp8-rngd-tp8-pp1-s8192-script
  namespace: llm-serving
data:
  compile.sh: |
    #!/bin/sh
    # Furiosa RNGD ahead-of-time compile (furiosa-llm). Mounted from a ConfigMap; all input via env.
    #
    #   MODEL_ID        HF repo id                              (required)
    #   OUTPUT          destination in the model store          (required)
    #   PREFETCHED_DIR  HF cache copy in the store, if present  (optional)
    #   TP, PP          tensor / pipeline parallel size
    #   MAX_LEN         max model length
    set -eu

    # RNGD's control processor is ARM64: the final EDF codegen needs an aarch64 cross-compiler,
    # which the furiosa-llm serve image does not ship.
    apt-get update -qq >/dev/null 2>&1
    apt-get install -y -qq gcc-aarch64-linux-gnu build-essential >/dev/null 2>&1

    # HF_HOME is local scratch — the downloader fails against the SMB-backed store (os error 95).
    mkdir -p /work/hub/hub
    if [ -n "${PREFETCHED_DIR:-}" ] && [ -d "$PREFETCHED_DIR" ]; then
      echo "reuse prefetched weights from store"
      cp -r "$PREFETCHED_DIR" /work/hub/hub/
      export HF_HUB_OFFLINE=1
    fi

    mkdir -p /work/out
    fxb build "$MODEL_ID" /work/out/model \
      -tp "$TP" -pp "$PP" --max-model-len "$MAX_LEN" --concurrency 8

    # Only the finished artifact goes back to the store.
    mkdir -p "$OUTPUT"
    cp -r /work/out/. "$OUTPUT"/
    echo COMPILE_DONE
    ls -la "$OUTPUT"
---
# Furiosa: fxb build for furiosa-ai quantized checkpoints. Installs the aarch64 cross-compiler, builds in local scratch, then copies to the model store.
apiVersion: batch/v1
kind: Job
metadata:
  name: compile-furiosa-ai--qwen3-4b-fp8-rngd-tp8-pp1-s8192
  namespace: llm-serving
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      volumes:
      - name: store
        persistentVolumeClaim:
          claimName: model-store
      - name: script
        configMap:
          name: compile-furiosa-ai--qwen3-4b-fp8-rngd-tp8-pp1-s8192-script
      - name: work
        emptyDir: {}
      containers:
      - name: compile
        image: furiosaai/furiosa-llm:latest
        command:
        - sh
        - /scripts/compile.sh
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: MODEL_STORE
          value: /mnt/store
        - name: MODEL_ID
          value: furiosa-ai/Qwen3-4B-FP8
        - name: OUTPUT
          value: /mnt/store/compiled/furiosa-ai--Qwen3-4B-FP8/furiosa/rngd-tp8-pp1-s8192
        - name: HF_HOME
          value: /work/hub
        - name: PREFETCHED_DIR
          value: /mnt/store/hub/hub/models--furiosa-ai--Qwen3-4B-FP8
        - name: TP
          value: '8'
        - name: PP
          value: '1'
        - name: MAX_LEN
          value: '8192'
        resources:
          requests:
            cpu: '8'
            memory: 16Gi
        volumeMounts:
        - name: store
          mountPath: /mnt/store
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: work
          mountPath: /work
