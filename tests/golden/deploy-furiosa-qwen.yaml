# title: deploy Qwen3-4B-FP8 ×1
# Deployment manifest preview. Review, then apply with `kubectl apply -f -`.
# Serving model furiosa-ai/Qwen3-4B-FP8. Engine: Furiosa-LLM.
# Placement: any. Total device demand = 1 x 1.
# If the image contains a TODO- placeholder, set LMD_SERVING_IMAGE before applying.
# Furiosa: furiosa-llm serve. Store-backed artifacts use the HF id plus --fxb so config/tokenizer still come from HF. Serving TP is PE count; resource devices are RNGD count.
apiVersion: apps/v1
kind: Deployment
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8, namespace: llm-serving }
spec:
  replicas: 1
  selector: { matchLabels: { app: serve-furiosa-ai-qwen3-4b-fp8 } }
  template:
    metadata: { labels: { app: serve-furiosa-ai-qwen3-4b-fp8, llm-d.ai/inferenceServing: "true", llm-d.ai/model: serve-furiosa-ai-qwen3-4b-fp8 } }
    spec:
      nodeSelector: { furiosa.ai/npu.product: rngd }
      volumes:
        - { name: cache, emptyDir: {} }
      containers:
        - name: server
          image: furiosaai/furiosa-llm:latest   # Furiosa-LLM
          args: ["serve", "furiosa-ai/Qwen3-4B-FP8", "--served-model-name", "furiosa-ai/Qwen3-4B-FP8", "--port", "8000", "--tensor-parallel-size", "8"]
          ports: [{ containerPort: 8000 }]
          env:
            - { name: HF_HOME, value: /model-cache }
            - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } } }
          resources: { limits: { furiosa.ai/rngd: 1 }, requests: { cpu: "4", memory: "16Gi", furiosa.ai/rngd: 1 } }
          volumeMounts:
            - { name: cache, mountPath: /model-cache }
---
# ── llm-d 라우팅: 게이트웨이 /rngd/qwen3-4b-fp8 → InferencePool(serve-furiosa-ai-qwen3-4b-fp8-pool) → EPP → 이 서빙 ──
# (공유 Role llmd-router-epp-sa/-non-sa 는 클러스터에 이미 존재한다고 가정)
apiVersion: v1
kind: ServiceAccount
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp-sa, namespace: llm-serving }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: llmd-router-epp-sa }
subjects:
  - { kind: ServiceAccount, name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp-non-sa, namespace: llm-serving }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: llmd-router-epp-non-sa }
subjects:
  - { kind: ServiceAccount, name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
---
# EPP 는 InferencePool 멤버십 검증 위해 TokenReview(auth 위임) 권한 필요 — 실동작 EPP 와 동일.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp-auth-delegator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator }
subjects:
  - { kind: ServiceAccount, name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
data:
  default-plugins.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: no-hit-lru-scorer
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
        insecureSkipVerify: true
    - type: core-metrics-extractor
      parameters:
        defaultEngine: vllm
        engineConfigs:
        - name: vllm
          queuedRequestsSpec: furiosa_llm_num_requests_waiting
          runningRequestsSpec: furiosa_llm_num_requests_running
          kvUsageSpec: furiosa_llm_kv_cache_usage_percent
          loraSpec: ""
          cacheInfoSpec: furiosa_llm_cache_config_info
    schedulingProfiles:
    - name: default
      plugins:
      - { pluginRef: queue-scorer, weight: 2 }
      - { pluginRef: kv-cache-utilization-scorer, weight: 2 }
      - { pluginRef: prefix-cache-scorer, weight: 3 }
      - { pluginRef: no-hit-lru-scorer, weight: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
spec:
  replicas: 1
  selector: { matchLabels: { app: serve-furiosa-ai-qwen3-4b-fp8-epp } }
  template:
    metadata: { labels: { app: serve-furiosa-ai-qwen3-4b-fp8-epp } }
    spec:
      serviceAccountName: serve-furiosa-ai-qwen3-4b-fp8-epp
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker-dev:main
          args: ["--pool-name", "serve-furiosa-ai-qwen3-4b-fp8-pool", "--pool-namespace", "llm-serving", "--pool-group", "inference.networking.k8s.io", "--config-file", "/config/default-plugins.yaml", "--zap-encoder", "json", "--tracing=false"]
          ports:
            - { name: grpc, containerPort: 9002 }
            - { name: grpc-health, containerPort: 9003 }
            - { name: metrics, containerPort: 9090 }
          livenessProbe: { grpc: { port: 9003, service: inference-extension }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { grpc: { port: 9003, service: inference-extension }, periodSeconds: 2 }
          env:
            - { name: NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          volumeMounts:
            - { name: plugins, mountPath: /config }
      volumes:
        - { name: plugins, configMap: { name: serve-furiosa-ai-qwen3-4b-fp8-epp } }
---
apiVersion: v1
kind: Service
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-epp, namespace: llm-serving }
spec:
  selector: { app: serve-furiosa-ai-qwen3-4b-fp8-epp }
  ports:
    - { name: grpc-ext-proc, port: 9002, targetPort: 9002 }
    - { name: http-metrics, port: 9090, targetPort: 9090 }
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-pool, namespace: llm-serving }
spec:
  selector: { matchLabels: { app: serve-furiosa-ai-qwen3-4b-fp8 } }
  targetPorts:
    - { number: 8000 }
  endpointPickerRef: { group: "", kind: Service, name: serve-furiosa-ai-qwen3-4b-fp8-epp, port: { number: 9002 }, failureMode: FailClose }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: serve-furiosa-ai-qwen3-4b-fp8-route, namespace: llm-serving }
spec:
  parentRefs:
    - { name: llm-d-gateway }
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /rngd/qwen3-4b-fp8 } }
      filters:
        - { type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: /v1 } } }
      backendRefs:
        - { group: inference.networking.k8s.io, kind: InferencePool, name: serve-furiosa-ai-qwen3-4b-fp8-pool }
