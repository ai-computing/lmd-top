# title: provenance /home/<user>/rbln-gemma4-26b-a4b-tp4-s8192
# Provenance probe — read /home/<user>/rbln-gemma4-26b-a4b-tp4-s8192 on node npu-node-1 (read-only)
# Reads the toolchain the artifact recorded; changes nothing.
# for deployment gemma4-rbln
apiVersion: batch/v1
kind: Job
metadata:
  name: probe-gemma4-rbln
  namespace: llm-serving
  labels:
    app.kubernetes.io/component: provenance-probe
    lmd-top/probe-of: gemma4-rbln
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: npu-node-1
      tolerations:
      - operator: Exists
      volumes:
      - name: artifact
        hostPath:
          path: /home/<user>/rbln-gemma4-26b-a4b-tp4-s8192
          type: Directory
      containers:
      - name: read
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -u
          echo "path: $DIR"
          if [ ! -d "$DIR" ]; then echo "MISSING: not a directory on this node"; exit 0; fi
          if [ -f "$DIR/lmd-build.json" ]; then
            echo "lmd-top build provenance (recorded facts; compatibility not established):"
            head -c 65536 "$DIR/lmd-build.json"
            echo
          fi
          echo "files:"
          ls -la "$DIR" 2>/dev/null | head -20
          echo

          read_rbln() {
            f=$1
            v=$(grep -o '"optimum_rbln_version"[[:space:]]*:[[:space:]]*"[^"]*"' "$f" 2>/dev/null       | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
            echo "built_with: optimum-rbln=${v:-unknown}   ($f)"
            grep -o '"cls_name"[[:space:]]*:[[:space:]]*"[^"]*"' "$f" 2>/dev/null | head -1
            grep -o '"dtype"[[:space:]]*:[[:space:]]*"[^"]*"' "$f" 2>/dev/null | head -1
          }

          read_fxb() {
            f=$1
            v=$(tail -c 262144 "$f" 2>/dev/null | tr -c '[:print:]
          ' '
          '       | awk '/"furiosa_compiler"/{f=1} f && /"version"/{ if (match($0,/[0-9][0-9.]*/)) { print substr($0,RSTART,RLENGTH); exit } }')
            echo "built_with: furiosa-compiler=${v:-unknown}   ($f)"
          }

          found=0
          if [ -f "$DIR/rbln_config.json" ]; then read_rbln "$DIR/rbln_config.json"; found=1
          elif [ -f "$DIR/model.fxb" ]; then read_fxb "$DIR/model.fxb"; found=1
          fi

          # Disaggregated builds keep one artifact per role (prefill/decode), so the config lives one
          # level down. Report every role rather than the first, since they can differ.
          if [ "$found" = 0 ]; then
            for d in "$DIR"/*/; do
              [ -d "$d" ] || continue
              if [ -f "$d/rbln_config.json" ]; then read_rbln "$d/rbln_config.json"; found=1
              elif [ -f "$d/model.fxb" ]; then read_fxb "$d/model.fxb"; found=1
              fi
            done
          fi

          [ "$found" = 0 ] && echo "built_with: unknown (no rbln_config.json or model.fxb here or one level down)"
          exit 0
        env:
        - name: DIR
          value: /artifact
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: artifact
          mountPath: /artifact
          readOnly: true
